name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to a PR supersedes its running checks. Each master push is its own group, so
# every commit on master is tested: a shared group would drop a queued run when a third arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    # macos-14 is where cc-hands runs the mock; ubuntu covers Linux consumers. The two ship
    # different openssl builds, which later tickets shell out to, so both images are pinned.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # Actions are pinned by commit SHA so a moved tag cannot change what a past commit ran.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
